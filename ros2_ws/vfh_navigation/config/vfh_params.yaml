vfh_node:
  ros__parameters:
    # Histogram
    num_sectors: 360
    density_threshold: 2.5   # menos conservador: mantiene abiertos valles laterales junto a pared
    smoothing_window: 5       # menos suavizado para no cerrar huecos estrechos por promediado
    max_range: 3.5

    # Robot geometry
    robot_radius: 0.22        # TurtleBot3 Waffle
    safety_margin: 0.01       # afloja el ensanchado VFH de obstáculos para permitir esquives más justos

    # VFH+ cost weights (valores del paper original: 5, 2, 2)
    w1: 5.0                   # towards target waypoint
    w2: 2.0                   # continuity with current direction
    w3: 2.0                   # smoothness vs previous cycle

    # Velocity limits
    max_linear_vel: 1.0       # forzado por encima del límite hardware (0.26 nominal)
    min_linear_vel: 0.08      # raised: 0.05 was too slow even in tight turns
    max_angular_vel: 1.82     # rad/s — TurtleBot3 Waffle hardware max
    angular_gain: 1.5         # angular = steer * gain; 1.5 avoids overshoot at 2.0
    brake_threshold: 6.0      # solo frena si algo grande y muy cercano llena el sector frontal

    # Waypoints
    waypoint_tolerance: 0.30  # ajustado al mínimo razonable
    waypoints_file: ''        # empty = auto-resolve from package

    # Valley selection
    obstacle_detect_range: 2.0
    min_valley_width: 0      # bins — ignora valles más estrechos (evita entrar en trampas obstáculo+pared)
    edge_safety_deg: 5        # offset desde el borde del valle hacia el centro (más holgura lateral)
    fallback_persist_cycles: 30  # ciclos manteniendo dirección cuando el valle desaparece a mitad de esquiva

    # Recovery
    stuck_timeout: 2.0        # reduced from 3.0 — faster recovery if VFH fails
    recovery_backup_dist: 0.4 # aumentado: 0.2m no sacaba al robot de la trampa persona+pared

histogram_matplotlib_node:
  ros__parameters:
    density_threshold: 1.35
    max_range: 3.5
    waypoints_file: ''            # empty = auto-resolve

histogram_viz_node:
  ros__parameters:
    density_threshold: 1.35       # matches vfh_node — threshold ring drawn here
    bar_width: 0.008              # LINE_LIST shaft width in metres
    max_bar_length: 0.45          # bar length at peak density (metres)
    inner_radius: 0.28            # bars start this far from robot centre (metres)
    frame_id: base_link

metrics_node:
  ros__parameters:
    waypoint_tolerance: 0.35      # metres — same as vfh_node
    evasion_threshold_deg: 30.0   # steering > this → evasive maneuver
    min_lap_time_s: 15.0          # guard against false lap detection at startup
    logs_dir: ''                  # empty = auto-resolve to <ws>/logs

path_recorder_node:
  ros__parameters:
    waypoint_tolerance: 0.35      # metres — same as vfh_node
    min_lap_time_s: 15.0          # guard against false lap detection at startup
    min_record_distance: 0.05     # metres — skip pose if robot hasn't moved this far
    logs_dir: ''                  # empty = auto-resolve to <ws>/logs
